<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{background:linear-gradient(160deg,#eaf4fc,#b0e0e6 55%,#8fbfe8);font-family:"Trebuchet MS",Verdana,Arial,sans-serif;color:#0b1f3a;display:flex;align-items:center;justify-content:center;padding:16px;min-height:100vh;min-height:100dvh}
.card{width:100%;max-width:440px;background:#ffffff;border-radius:24px;padding:26px 20px;text-align:center;box-shadow:0 8px 28px rgba(11,31,58,.3)}
.mock{position:fixed;top:0;left:0;right:0;background:#0b1f3a;color:#fff;font-size:12px;padding:5px 8px;text-align:center;z-index:9}
body{padding-top:40px}
button{font:inherit;cursor:pointer}
#axo{width:200px;max-width:70%;height:auto;animation:b 2.6s ease-in-out infinite;cursor:pointer;-webkit-tap-highlight-color:transparent}
@keyframes b{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#axo{animation:none}}
h1{font-size:36px;margin:8px 0 4px}p{margin:6px 0;font-size:18px;line-height:1.4}
.screen{display:none}.screen.on{display:block}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0 18px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid #0b1f3a;display:block}.dots i.f{background:#0b1f3a}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:0 auto}
.pad button{height:62px;font-size:26px;border:0;border-radius:18px;background:#dcecf9;color:#0b1f3a;border:2px solid #7fb2e0;touch-action:manipulation}
.pad button:active{background:#b0e0e6}
.err{color:#0b3a8a;min-height:24px;font-size:16px}
.small{font-size:14px;opacity:.8}
.list{text-align:left;margin:12px 0;max-height:46vh;overflow:auto}
.m{background:#dcecf9;border-radius:16px;padding:10px 14px;margin:8px 0;font-size:17px;word-wrap:break-word}
.m b{display:block;font-size:12px;opacity:.7;font-weight:normal}
.m.me{background:#0b1f3a;color:#fff}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px;border:2px solid #7fb2e0;border-radius:14px;color:#0b1f3a}
.send{border:0;background:#0b1f3a;color:#fff;border-radius:14px;padding:0 18px;font-size:17px}
.link{background:none;border:0;color:#0b1f3a;text-decoration:underline;margin-top:12px;font-size:15px}
</style></head><body>
<div class="mock">MOCK-UP - dummy messages only - not secured, nothing is saved or sent</div>
<div class="card">
<div id="s2" class="screen on">
<div style="font-size:54px;line-height:1" aria-hidden="true">&#128153;</div><h1>Hi Dad</h1><p>Enter your PIN</p>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
<div class="err" id="err" aria-live="polite"></div>
<div class="pad" id="pad"></div>
<p class="small">Mock-up: PIN is 1234. The real one will be checked on a server.</p>
</div>
<div id="s3" class="screen">
<h1>Messages</h1>
<div class="list" id="list"></div>
<form id="f" autocomplete="off"><input id="t" maxlength="140" placeholder="Write one line" aria-label="Message"><button class="send">Send</button></form>
<p class="small">Mock-up: messages vanish when you reload.</p>
<button class="link" id="out">Lock</button></div>
</div>
<script>
var PIN="1234",buf="",$=function(i){return document.getElementById(i)};
function show(n){["s2","s3"].forEach(function(s){$(s).className="screen"+(s==n?" on":"")})}
var msgs=[{w:"Tima",t:"Dummy message: hi!"},{w:"Dad",t:"Dummy message: hello from Dad"}];
function draw(){$("list").innerHTML=msgs.slice().reverse().map(function(m){return '<div class="m'+(m.w=="Dad"?" me":"")+'"><b>'+m.w+'</b>'+m.t.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</div>'}).join("")}
function dots(){var d=$("dots").children;for(var i=0;i<4;i++)d[i].className=i<buf.length?"f":""}
var keys=["1","2","3","4","5","6","7","8","9","","0","\u232b"];
keys.forEach(function(k){var b=document.createElement("button");b.textContent=k;b.type="button";if(!k)b.style.visibility="hidden";b.onclick=function(){
$("err").textContent="";if(k=="\u232b")buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;dots();
if(buf.length==4){setTimeout(function(){if(buf==PIN){buf="";dots();draw();show("s3")}else{buf="";dots();$("err").textContent="Try again"}},150)}};$("pad").appendChild(b)});



$("out").onclick=function(){buf="";dots();show("s2")};
$("f").onsubmit=function(e){e.preventDefault();var v=$("t").value.trim();if(!v)return;msgs.push({w:"Dad",t:v});$("t").value="";draw()};
</script></body></html>
